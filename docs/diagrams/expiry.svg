<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" role="img" aria-label="Text sharing and expiry"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="900" height="525" rx="18" fill="#0f172a"/><g font-family="Arial,Helvetica,sans-serif"><text x="450" y="43" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Text sharing and expiry</text><rect x="65" y="70" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="105" text-anchor="middle" font-size="18" fill="#e2e8f0">Validate text and request ID</text><path d="M450 129V151" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="156" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="191" text-anchor="middle" font-size="18" fill="#e2e8f0">Existing request: return original share; new request: claim four-digit ID</text><path d="M450 215V237" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="242" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="277" text-anchor="middle" font-size="18" fill="#e2e8f0">Save with eleven-hour expiry → searchable public feed</text><path d="M450 301V323" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="328" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="363" text-anchor="middle" font-size="18" fill="#e2e8f0">At expiry: share becomes unavailable</text><path d="M450 387V409" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="414" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="449" text-anchor="middle" font-size="18" fill="#e2e8f0">Feed access or scheduled cleanup removes stored records and files</text></g></svg>