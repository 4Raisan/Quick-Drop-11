<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" role="img" aria-label="Components and responsibilities"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="900" height="611" rx="18" fill="#0f172a"/><g font-family="Arial,Helvetica,sans-serif"><text x="450" y="43" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Components and responsibilities</text><rect x="65" y="70" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="105" text-anchor="middle" font-size="18" fill="#e2e8f0">Browser → public UI + frontend upload client</text><path d="M450 129V151" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="156" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="191" text-anchor="middle" font-size="18" fill="#e2e8f0">UI → feed / download API + stats API</text><path d="M450 215V237" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="242" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="277" text-anchor="middle" font-size="18" fill="#e2e8f0">Upload client → upload API for reservation and scoped token</text><path d="M450 301V323" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="328" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="363" text-anchor="middle" font-size="18" fill="#e2e8f0">Upload client → Supabase Storage directly for file bytes</text><path d="M450 387V409" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="414" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="449" text-anchor="middle" font-size="18" fill="#e2e8f0">API handlers + cleanup → storage and file validation modules</text><path d="M450 473V495" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="500" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="535" text-anchor="middle" font-size="18" fill="#e2e8f0">Storage adapter → local .data OR Supabase Postgres + private file bucket</text></g></svg>