<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">Quick Drop 11 architecture</title><desc id="desc">The public browser sends metadata to the Vercel API and uploads file bytes directly to private Supabase Storage using signed URLs. The server verifies files and keeps share records in Supabase Postgres. Local development uses isolated disk storage.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#60a5fa"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#34d399"/></marker></defs><rect width="1000" height="760" rx="24" fill="#0b1220"/><g font-family="Arial,Helvetica,sans-serif"><text x="50" y="48" fill="#f8fafc" font-size="26" font-weight="700">Quick Drop 11 architecture</text><text x="50" y="75" fill="#94a3b8" font-size="16">Metadata through the API. File bytes directly to storage.</text><rect x="35" y="98" width="930" height="175" rx="18" fill="#111e33" stroke="#334155"/><text x="55" y="126" fill="#93c5fd" font-size="13" font-weight="700">PUBLIC BROWSER</text><rect x="35" y="321" width="930" height="383" rx="18" fill="#101c29" stroke="#334155"/><text x="55" y="348" fill="#6ee7b7" font-size="13" font-weight="700">SERVER &amp; PRIVATE DATA STORES</text><rect x="285" y="139" width="430" height="112" rx="14" fill="#17243a" stroke="#60a5fa"/><text x="307" y="174" fill="#f8fafc" font-size="20" font-weight="700">Browser interface</text><text x="307" y="204" fill="#b8c5da" font-size="15">Text, search, QR, stats and retry queue</text><text x="307" y="228" fill="#b8c5da" font-size="15">No server credentials in the browser</text><path d="M365 252L250 366" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/><text x="62" y="299" fill="#93c5fd" font-size="15">Metadata / scoped upload &amp; download URLs</text><path d="M635 252L750 366" stroke="#34d399" stroke-width="2.5" marker-end="url(#green)"/><text x="632" y="299" fill="#6ee7b7" font-size="15">Direct file upload · up to 5 MiB</text><rect x="65" y="372" width="370" height="136" rx="14" fill="#17243a" stroke="#60a5fa"/><text x="87" y="407" fill="#f8fafc" font-size="20" font-weight="700">Vercel Node.js API</text><text x="87" y="437" fill="#b8c5da" font-size="15">Feed, ID reservation, upload verification</text><text x="87" y="461" fill="#b8c5da" font-size="15">Short-lived downloads, aggregate stats</text><text x="87" y="485" fill="#b8c5da" font-size="15">Server key stays here</text><rect x="565" y="372" width="370" height="136" rx="14" fill="#17243a" stroke="#34d399"/><text x="587" y="407" fill="#f8fafc" font-size="20" font-weight="700">Supabase Storage</text><text x="587" y="437" fill="#b8c5da" font-size="15">Private quickdrop-files bucket</text><text x="587" y="461" fill="#b8c5da" font-size="15">PNG / JPEG / WebP / PDF</text><text x="587" y="485" fill="#b8c5da" font-size="15">Signed access; 11-hour share expiry</text><path d="M436 447H560" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/><text x="498" y="421" text-anchor="middle" fill="#93c5fd" font-size="13">Verify / delete</text><path d="M250 510V559" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/><text x="275" y="541" fill="#93c5fd" font-size="13">Share metadata</text><rect x="65" y="565" width="370" height="112" rx="14" fill="#17243a" stroke="#a78bfa"/><text x="87" y="600" fill="#f8fafc" font-size="20" font-weight="700">Supabase Postgres</text><text x="87" y="630" fill="#b8c5da" font-size="15">Four-digit IDs, reservations, timestamps</text><text x="87" y="654" fill="#b8c5da" font-size="15">RLS enabled; server-only table access</text><rect x="565" y="565" width="370" height="112" rx="14" fill="#17243a" stroke="#64748b"/><text x="587" y="600" fill="#f8fafc" font-size="20" font-weight="700">Local development</text><text x="587" y="630" fill="#b8c5da" font-size="15">Same handlers + isolated .data/ adapter</text><text x="587" y="654" fill="#b8c5da" font-size="15">Production credentials are not auto-loaded</text><text x="50" y="736" fill="#94a3b8" font-size="14">Cleanup: feed access + scheduled API remove expired records, attachments and old orphan files.</text></g></svg>