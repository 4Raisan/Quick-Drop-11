<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Quick Drop 11 architecture</title><desc id="desc">The browser sends metadata through the Vercel API to Supabase Postgres. Files upload directly to private Supabase Storage using signed links. The API verifies uploads before publishing.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#94a3b8"/></marker>
<marker id="fileArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#34d399"/></marker>
<symbol id="browser" viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="24" rx="3"/><path d="M3 11h26M8 8h1m3 0h1"/></symbol>
<symbol id="server" viewBox="0 0 32 32"><rect x="4" y="3" width="24" height="11" rx="3"/><rect x="4" y="18" width="24" height="11" rx="3"/><path d="M9 8h1m5 0h8M9 23h1m5 0h8"/></symbol>
<symbol id="database" viewBox="0 0 32 32"><ellipse cx="16" cy="7" rx="12" ry="4"/><path d="M4 7v18c0 5 24 5 24 0V7M4 16c0 5 24 5 24 0"/></symbol>
<symbol id="file" viewBox="0 0 32 32"><path d="M7 3h12l7 7v19H7ZM19 3v8h7M12 18h9m-9 5h9"/></symbol>
</defs>
<rect width="1000" height="460" rx="22" fill="#0b1220"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<text x="500" y="45" fill="#f8fafc" font-size="25" font-weight="700">How Quick Drop 11 works</text>
<g fill="#142238" stroke="#334155" stroke-width="1.5"><rect x="45" y="95" width="240" height="130" rx="16"/><rect x="380" y="95" width="240" height="130" rx="16"/><rect x="715" y="95" width="240" height="130" rx="16"/><rect x="715" y="300" width="240" height="120" rx="16" stroke="#34d399"/></g>
<g fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#browser" x="147" y="114" width="36" height="36"/><use href="#server" x="482" y="114" width="36" height="36"/><use href="#database" x="817" y="114" width="36" height="36"/><use href="#file" x="817" y="316" width="36" height="36" stroke="#34d399"/></g>
<g fill="#f8fafc" font-size="20" font-weight="700"><text x="165" y="178">Browser</text><text x="500" y="178">Vercel API</text><text x="835" y="178">Supabase Postgres</text><text x="835" y="379">Supabase Storage</text></g>
<g fill="#94a3b8" font-size="15"><text x="165" y="203">Share · search · QR</text><text x="500" y="203">IDs · verify · signed links</text><text x="835" y="203">Share records</text><text x="835" y="403">Private images &amp; PDFs</text></g>
<g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"><path d="M287 160H374"/><path d="M622 160H709"/><path d="M500 227V270H835V294"/></g>
<g fill="#b8c5da" font-size="12"><text x="332" y="146">Requests</text><text x="667" y="146">Records</text><text x="656" y="258">Verify files / issue links</text></g>
<path d="M165 227V365H709" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#fileArrow)"/>
<text x="430" y="348" fill="#6ee7b7" font-size="16">Direct file upload · up to 5 MB</text>
<text x="500" y="446" fill="#94a3b8" font-size="14">4-digit IDs · 11-hour expiry · Server credentials stay in the API</text>
</g></svg>
