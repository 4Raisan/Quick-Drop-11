<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 783" role="img" aria-label="Production attachment upload"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="900" height="783" rx="18" fill="#0f172a"/><g font-family="Arial,Helvetica,sans-serif"><text x="450" y="43" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Production attachment upload</text><rect x="65" y="70" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="105" text-anchor="middle" font-size="18" fill="#e2e8f0">Browser: validate file and calculate SHA-256</text><path d="M450 129V151" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="156" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="191" text-anchor="middle" font-size="18" fill="#e2e8f0">Browser → API: caption, metadata and request ID</text><path d="M450 215V237" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="242" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="277" text-anchor="middle" font-size="18" fill="#e2e8f0">API → Postgres: reserve four-digit ID, expiry and private file path</text><path d="M450 301V323" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="328" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="363" text-anchor="middle" font-size="18" fill="#e2e8f0">API → browser: signed upload URL for the reserved file path</text><path d="M450 387V409" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="414" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="449" text-anchor="middle" font-size="18" fill="#e2e8f0">Browser → private Supabase bucket: upload file bytes directly</text><path d="M450 473V495" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="500" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="535" text-anchor="middle" font-size="18" fill="#e2e8f0">Browser → API: complete the reserved upload</text><path d="M450 559V581" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="586" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="621" text-anchor="middle" font-size="18" fill="#e2e8f0">API → storage: read metadata and bytes; verify size, signature and hash</text><path d="M450 645V667" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="672" width="770" height="58" rx="12" fill="#17243c" stroke="#3b82f6"/><text x="450" y="707" text-anchor="middle" font-size="18" fill="#e2e8f0">API → Postgres: publish verified share; confirm four-digit ID</text></g></svg>